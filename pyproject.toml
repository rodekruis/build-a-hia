[project]
name = "build-a-hia"
version = "0.1.0"
description = "Turn source documents into reviewable Helpful Information App (HIA) drafts."
requires-python = ">=3.12"
dependencies = [
    "azure-data-tables>=12.7.0",
    "azure-identity>=1.26.0",
    "azure-storage-blob>=12.31.0",
    "azure-storage-queue>=12.18.0",
    "docling>=2,<3",
    "flask>=3.1,<4",
    "flask-wtf>=1.2,<2",
    "gunicorn>=22,<23",
    "onnxruntime>=1.30.0",
    "openai>=1.100,<3",
    "openpyxl>=3.1",
    "pillow>=12.3.0",
    "pydantic>=2.7,<3",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1,<2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "urllib3>=2,<3",
]

[project.scripts]
hia-worker = "build_a_hia.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build_a_hia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docling'"
markers = ["docling: runs real Docling conversions (slow, downloads models)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "T20", "N", "RET", "PTH", "D", "S"]
# Google style documents __init__ arguments in the class docstring.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
