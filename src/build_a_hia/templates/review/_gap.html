<li class="source" id="gap-{{ gap.id }}">
  <div class="source-head">
    {% if on_overview %}
      <span class="ref">{{ gap.group }} ›</span>
    {% endif %}
    <strong>{{ gap.kind_label }}</strong>
    {% if gap.item %}<span class="meta">· {{ gap.item_type }} {{ gap.item }}</span>{% endif %}
    {% if gap.field %}<span class="meta">· {{ gap.field }}</span>{% endif %}
  </div>
  <p>{{ gap.issue }}</p>
  <p class="gap-action"><strong>Suggested action:</strong> {{ gap.suggested_action }}</p>
</li>
