name: deploy to prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ github.event.repository.name }}:${{ github.sha }}
  RESOURCE_GROUP: hia-infra-prod

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push container image to container registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment:
      name: 'prod'
      url: https://build-a-hia.510.global
    # Lets azure/login exchange a GitHub token for the managed identity; no Azure password stored.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy container image to the jobs and the web app
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          # Jobs first, so new web app code never queues work for old job code.
          for job in hia-convert hia-generate hia-cleanup; do
            az containerapp job update -g "$RESOURCE_GROUP" -n "$job" --image "$IMAGE" --only-show-errors -o none
          done
          az containerapp update -g "$RESOURCE_GROUP" -n build-a-hia --image "$IMAGE" --only-show-errors -o none

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Wait for the service to be healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "https://build-a-hia.510.global/health" > /dev/null; then
              echo "Service is healthy."
              exit 0
            fi
            echo "Attempt $i: service not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "::error::Service did not become healthy in time."
          exit 1
